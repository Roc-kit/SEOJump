<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEOJump Workflow</title>
  <link rel="stylesheet" href="styles/sidepanel.css">
</head>
<body>
  <main class="panel-shell">
    <header class="panel-header">
      <div>
        <span class="eyebrow">SEOJump</span>
        <h1>Workflow</h1>
      </div>
      <select id="workflow-select" aria-label="Workflow"></select>
    </header>

    <section id="empty-state" class="empty-state" hidden>
      <h2>No workflows yet</h2>
      <p>Add a starter workflow from the SEOJump website.</p>
      <a href="https://searchengines.cc/workflows" target="_blank" rel="noreferrer">Browse Workflows</a>
    </section>

    <div id="workflow-view" hidden>
      <section class="context-card">
        <div class="section-row">
          <span class="section-label">Context</span>
          <button id="refresh-context" class="text-button" type="button">Use current page</button>
        </div>
        <div class="context-value"><span>Keyword</span><strong id="context-keyword"></strong></div>
        <div class="context-value"><span>Domain</span><strong id="context-domain"></strong></div>
        <div class="context-value"><span>URL</span><small id="context-url"></small></div>
      </section>

      <section class="workflow-summary">
        <h2 id="workflow-title"></h2>
        <p id="workflow-description"></p>
      </section>

      <ol id="step-list" class="step-list"></ol>
    </div>
  </main>
  <script src="src/sidepanel/main.js"></script>
</body>
</html>
