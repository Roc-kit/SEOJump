<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            padding: 15px;
            margin: 0px;
            width: max-content;
            height: max-content;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 30px 8px 8px;
            color: rgb(0, 0, 0);
            text-decoration: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .link:hover {
            background-color: #f5f5f5;
            color: rgb(114, 89,254);
            border-radius: 6px;
        }
        .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .icon svg {
            width: 100%;
            height: 100%;
            fill: currentColor;
        }
    </style>
</head>
<body>

</html>
